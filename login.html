<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life-Branch | Entrar ou Cadastrar-se</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <header>
    <a href="index.html">💰 Life-Branch</a>
    <nav>
      <a href="index.html">← Voltar para o início</a>
    </nav>
  </header>

  <hr>

  <main>
    <section id="login">
      <h2>Acessar sua conta</h2>
      <p>Entre para acessar suas simulações salvas.</p>

      <!-- Adicionado um ID para o formulário -->
      <form id="form-login" action="#" method="POST">
        <div>
          <label for="login-email">E-mail:</label><br>
          <input type="email" id="login-email" name="email" placeholder="seu@email.com" required>
        </div>

        <br>

        <div>
          <label for="login-senha">Senha:</label><br>
          <input type="password" id="login-senha" name="senha" placeholder="Sua senha" required>
        </div>

        <br>

        <div>
          <input type="checkbox" id="lembrar" name="lembrar">
          <label for="lembrar">Lembrar de mim</label>
        </div>

        <br>

        <button type="submit">Entrar</button>
      </form>
    </section>

    <hr>

    <section id="cadastro">
      <h2>Criar uma nova conta</h2>
      <p>Comece a projetar os próximos passos da sua vida hoje.</p>

      <form action="#" method="POST">
        <div>
          <label for="cad-nome">Nome Completo:</label><br>
          <input type="text" id="cad-nome" name="nome" placeholder="Ex: Maria Silva" required>
        </div>

        <br>

        <div>
          <label for="cad-email">E-mail:</label><br>
          <input type="email" id="cad-email" name="email" placeholder="seu@email.com" required>
        </div>

        <br>

        <div>
          <label for="cad-senha">Criar Senha:</label><br>
          <input type="password" id="cad-senha" name="senha" placeholder="Mínimo 8 caracteres" minlength="8" required>
        </div>

        <br>

        <div>
          <label for="cad-confirma-senha">Confirmar Senha:</label><br>
          <input type="password" id="cad-confirma-senha" name="confirma-senha" placeholder="Repita a senha" required>
        </div>

        <br>

        <div>
          <input type="checkbox" id="termos" name="termos" required>
          <label for="termos">Aceito os <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a></label>
        </div>

        <br>

        <button type="submit">Criar Minha Conta</button>
      </form>
    </section>
  </main>

  <hr>

  <footer>
    <p>&copy; 2026 Senai-cetaf. Projeto Acadêmico de Desenvolvimento Web.</p>
  </footer>

  <!-- CÓDIGO JAVASCRIPT INTEGRADO DIRETAMENTE NO HTML -->
  <script>
    const formLogin = document.getElementById('form-login');

    if (formLogin) {
        formLogin.addEventListener('submit', function(event) {
            // Impede o envio padrão do formulário para evitar o recarregamento
            event.preventDefault(); 

            // Redireciona para a página de visão geral
            window.location.href = 'visao_geral.html';
        });
    }
  </script>

</body>
</html>
